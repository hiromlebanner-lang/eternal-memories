<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      body{margin:0;background:#fdf5f8;color:#4b3340;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .wrap{width:100%;padding:24px 12px}.card{max-width:560px;margin:auto;padding:30px 24px;border:1px solid #ead9e1;border-radius:22px;background:#fff}
      .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-size:20px;font-weight:700;color:#5b3448}.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover}
      h1{margin:0 0 18px;font-size:24px;line-height:1.4;color:#5b3448}p{margin:0 0 16px;font-size:16px;line-height:1.75}
      .button{display:block;margin:24px 0;padding:15px 18px;border-radius:14px;background:#ad4d72;color:#fff!important;text-align:center;text-decoration:none;font-weight:700}
      .url{padding:12px;border-radius:10px;background:#f8edf2;color:#76566a;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
      .note,.footer{color:#765f6b;font-size:13px}.footer{margin-top:28px;padding-top:20px;border-top:1px solid #eadde3}
      @media(prefers-color-scheme:dark){body{background:#21191d;color:#f7eaf0}.card{border-color:#544049;background:#30242a}.brand,h1{color:#fff}.url{background:#44333b;color:#f0dce5}.note,.footer{color:#d9c3cd}.footer{border-color:#544049}}
    </style>
  </head>
  <body>
    <div class="wrap"><main class="card">
      <div class="brand"><img src="https://mapalbum-japan-2026.vercel.app/eternal-memories-map-pin.jpg" alt="Eternal memories" />Eternal memories</div>
      <h1>Eternal memoriesへの招待</h1>
      <p>Eternal memoriesの利用招待が届いています。</p>
      <p>下のボタンを押して、登録またはログインを完了してください。</p>
      <a class="button" href="{{ .ConfirmationURL }}">招待を確認する</a>
      <p class="note">ボタンを利用できない場合は、次のURLをブラウザで開いてください。</p>
      <p class="url">{{ .ConfirmationURL }}</p>
      <p class="note">このメールに心当たりがない場合は、操作せずそのまま破棄してください。</p>
      <footer class="footer">Eternal memories<br />家族・友人との思い出を、写真と地図に残そう。</footer>
    </main></div>
  </body>
</html>
